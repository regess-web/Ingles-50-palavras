<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglês: 50 palavras por dia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&family=Newsreader:ital,wght@0,500;1,500&display=swap">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#16213a;--mute:#5d6882;--line:#d9dfec;--accent:#2b4fd8;--accent-ink:#fff;--ok-bg:#d3f3df;--ok-line:#1c9a55;--bad-bg:#fbdada;--bad-line:#d23b3b;--mark:#fff1b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#eaeefb;--mute:#9aa6c4;--line:#2b3757;--accent:#7b97ff;--accent-ink:#0e1424;--ok-bg:#12432b;--ok-line:#3ccd7f;--bad-bg:#4a1d22;--bad-line:#ff7a7a;--mark:#5a4a12}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#eaeefb;--mute:#9aa6c4;--line:#2b3757;--accent:#7b97ff;--accent-ink:#0e1424;--ok-bg:#12432b;--ok-line:#3ccd7f;--bad-bg:#4a1d22;--bad-line:#ff7a7a;--mark:#5a4a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px;margin:14px 0}
.word{font-family:"Newsreader",Georgia,serif;font-size:3rem;line-height:1.1;margin:6px 0 2px;word-break:break-word}
.sent{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:1.5rem;line-height:1.35;margin:8px 0}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 3px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{font:inherit;color:inherit;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-height:52px}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-line)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.opt:disabled{cursor:default;color:inherit}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 18px;cursor:pointer;width:100%;margin-top:10px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row .btn{width:auto;margin:0}
.tr{margin-top:10px;color:var(--mute)}
.tag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:20px;background:var(--bad-bg);margin-left:6px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.item b{font-size:1.15rem}
.big{font-size:2.4rem;font-weight:700;margin:0}
</style>
</head>
<body>
<main id="app"></main>

gamos um veleiro."],["sandbox","s.","caixa de areia","The kids play in the sandbox.","As crianças brincam na caixa de areia."],["scaffold","s.","andaime","Workers stood on the scaffold.","Operários ficavam no andaime."]];
const PER=50,DAYS=Math.ceil(DATA.length/PER);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let day=Math.min(Math.max(store.get('day',1),1),DAYS);
let S=null;

function dayIdx(d){const s=(d-1)*PER;return Array.from({length:Math.min(PER,DATA.length-s)},(_,i)=>s+i)}

function options(i,f){
  const c=DATA[i],right=c[f],set=new Set([right]),out=[right];let tries=0;
  while(out.length<4&&tries<400){
    tries++;
    const j=Math.floor(Math.random()*DATA.length),m=DATA[j][f];
    if(j===i||set.has(m))continue;
    if(out.length<3&&tries<150&&(f===2?DATA[j][1]!==c[1]:(m.length<right.length*0.6||m.length>right.length*1.6)))continue;
    set.add(m);out.push(m);
  }
  return shuffle(out);
}

function hl(sentence,word){
  const base=word.split(' / ')[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const t=esc(sentence);
  try{const r=new RegExp('\\b('+base+'\\w*)','i');return r.test(t)?t.replace(r,'<mark>$1</mark>'):t}catch(e){return t}
}

function home(){
  S=null;
  const idx=dayIdx(day);
  app.innerHTML=`<h1>Inglês: 50 palavras por dia</h1>
  <p class="mute">Das mais usadas para as menos usadas.</p>
  <div class="card">
    <p class="big">Dia ${day}</p>
    <p class="mute">Palavras ${idx[0]+1} a ${idx[idx.length-1]+1} de ${DATA.length}</p>
    <button class="btn" id="go">Começar o dia ${day}</button>
    <div class="row" style="margin-top:12px">
      <button class="btn alt" id="prev" ${day<=1?'disabled':''}>Dia anterior</button>
      <button class="btn alt" id="next" ${day>=DAYS?'disabled':''}>Próximo dia</button>
    </div>
  </div>`;
  document.getElementById('go').onclick=()=>start(idx);
  document.getElementById('prev').onclick=()=>{day--;store.set('day',day);home()};
  document.getElementById('next').onclick=()=>{day++;store.set('day',day);home()};
}

function start(list){
  S={q:list.slice(),pos:0,phase:0,wrong:new Set(),right:0,total:0,done:false};
  question();
}

function question(){
  const i=S.q[S.pos],c=DATA[i],opts=options(i,S.phase===0?2:4);
  S.cur={i,answered:false};
  const head=`<div class="bar"><i style="width:${Math.round((S.pos+S.phase/2)/S.q.length*100)}%"></i></div>
  <p class="mute">Palavra ${S.pos+1} de ${S.q.length}</p>`;
  const body=S.phase===0
    ?`<p class="mute">Qual é o significado de</p><p class="word">${esc(c[0])}</p><p class="mute">${esc(c[1])}</p>`
    :`<p class="mute">Como se traduz esta frase?</p><p class="sent">${hl(c[3],c[0])}</p>`;
  app.innerHTML=`${head}<div class="card">${body}<div class="opts">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div></div><div id="nx"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,c));
}

function answer(btn,c){
  if(S.cur.answered)return;
  S.cur.answered=true;S.total++;
  const f=S.phase===0?2:4;const ok=btn.textContent===c[f];
  if(ok)S.right++;else{S.wrong.add(S.cur.i);btn.classList.add('bad')}
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===c[f])b.classList.add('ok')});
  const last=S.phase===1&&S.pos===S.q.length-1;
  const nx=document.getElementById('nx');
  nx.innerHTML=`<button class="btn" id="n">${last?'Ver resultado':'Continuar'}</button>`;
  const n=document.getElementById('n');n.onclick=advance;n.focus();
}

function advance(){
  if(S.phase===0){S.phase=1;return question()}
  S.phase=0;S.pos++;
  if(S.pos>=S.q.length)return summary();
  question();
}

function summary(){
  const w=S.wrong.size,all=S.q.length;
  app.innerHTML=`<h1>Fim da rodada</h1>
  <div class="card"><p class="big">${S.right} de ${S.total}</p>
  <p class="mute">${w?`Você errou ${w} ${w===1?'palavra':'palavras'}.`:'Você acertou tudo. Ótimo!'}</p>
  <button class="btn" id="rev">Revisar as ${all} palavras</button>
  ${w?`<button class="btn alt" id="redo">Refazer só as erradas</button>`:''}
  <button class="btn alt" id="fin">Concluir o dia ${day}</button></div>`;
  document.getElementById('rev').onclick=review;
  const r=document.getElementById('redo');if(r)r.onclick=()=>start([...S.wrong]);
  document.getElementById('fin').onclick=()=>{if(day<DAYS){day++;store.set('day',day)}home()};
}

function review(){
  const q=S.q.slice().sort((a,b)=>S.wrong.has(b)-S.wrong.has(a)||a-b);
  app.innerHTML=`<h1>Revisão</h1><p class="mute">As que você errou aparecem primeiro.</p>
  <div class="card">${q.map(i=>{const c=DATA[i];return `<div class="item"><b>${esc(c[0])}</b>${S.wrong.has(i)?'<span class="tag">errou</span>':''} <span class="mute">${esc(c[1])}</span><br>${esc(c[2])}<div class="sent" style="font-size:1.1rem">${hl(c[3],c[0])}</div><div class="mute">${esc(c[4])}</div></div>`}).join('')}</div>
  <button class="btn alt" id="back">Voltar ao resultado</button>`;
  document.getElementById('back').onclick=summary;
  window.scrollTo(0,0);
}

home();
</script>
